<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Water Fund</title>

<style>
:root{
--bg:#05060a;
--bg2:#0b0f1a;
--ink:#f3f6ff;
}

html,body{
margin:0;
height:100%;
background:radial-gradient(1200px 900px at 60% 30%, var(--bg2), var(--bg));
color:var(--ink);
font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
overflow:hidden;
}

canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
}

.overlay{
position:fixed;
top:0;left:0;
width:100%;
height:100%;
display:grid;
grid-template-columns: 520px 1fr;
padding:60px;
z-index:10;
}

h1{
font-size:32px;
letter-spacing:.12em;
text-transform:uppercase;
margin:0 0 12px 0;
font-weight:600;
}

.copy{
max-width:500px;
}

.copy p{
font-size:15px;
line-height:1.8;
opacity:.85;
}

.reveal{
opacity:0;
transition:opacity 2s ease;
margin-top:12px;
letter-spacing:.14em;
text-transform:uppercase;
font-size:12px;
}

.reveal.on{opacity:.7;}

svg{
width:100%;
height:100%;
}

.labels{
font-size:22px;
letter-spacing:.06em;
fill:rgba(255,255,255,.85);
font-weight:500;
}
</style>
</head>

<body>

<canvas id="globe"></canvas>

<div class="overlay">
  <div class="copy">
    <h1>Planetary Stability Thresholds</h1>
    <p>
      Planetary stability depends on a small number of critical thresholds.  
      Water links climate, food, coastlines, ecosystems and human security.
    </p>
    <div id="reveal" class="reveal">From Planet To Policy</div>
  </div>

  <svg viewBox="-200 -200 1400 1400">
    <defs>
      <radialGradient id="g">
        <stop offset="0%" stop-color="#9fdcff" stop-opacity=".4"/>
        <stop offset="60%" stop-color="#9fdcff" stop-opacity=".08"/>
        <stop offset="100%" stop-color="transparent"/>
      </radialGradient>
    </defs>

    <circle cx="500" cy="500" r="430" fill="url(#g)"/>

    <circle cx="500" cy="500" r="210" fill="none" stroke="rgba(255,255,255,.14)"/>
    <circle cx="500" cy="500" r="300" fill="none" stroke="rgba(255,255,255,.12)"/>
    <circle cx="500" cy="500" r="390" fill="none" stroke="rgba(255,255,255,.10)"/>

    <g class="labels">
      <text x="500" y="90" text-anchor="middle">
        <tspan x="500" dy="0">Climate</tspan>
        <tspan x="500" dy="28">Variability</tspan>
      </text>

      <text x="920" y="320" text-anchor="start">
        <tspan x="920" dy="0">Freshwater</tspan>
        <tspan x="920" dy="28">Availability</tspan>
      </text>

      <text x="920" y="730" text-anchor="start">
        <tspan x="920" dy="0">Food</tspan>
        <tspan x="920" dy="28">Systems</tspan>
      </text>

      <text x="500" y="1020" text-anchor="middle">
        <tspan x="500" dy="0">Coastal</tspan>
        <tspan x="500" dy="28">Stability</tspan>
      </text>

      <text x="80" y="730" text-anchor="end">
        <tspan x="80" dy="0">Human</tspan>
        <tspan x="80" dy="28">Security</tspan>
      </text>
    </g>
  </svg>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
