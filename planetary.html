<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Planetary Stability — Global Water Fund</title>

<style>
html,body{
  margin:0;height:100%;
  background:#05070d;
  color:white;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  overflow:hidden;
}

/* two tabs only */
.tabs{
  position:fixed;
  top:14px;right:14px;
  z-index:10;
  display:flex;
  gap:10px;
}
.tabs a{
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  padding:10px 14px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.45);
  color:#ddd;
  text-decoration:none;
}

/* center stage */
.stage{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
}

/* COLOR EARTH */
.earth{
  width:70vmin;
  height:70vmin;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 30%, #2b6cff, #001126 60%);
  box-shadow:0 0 120px rgba(0,0,0,.8);
  position:relative;
  overflow:hidden;
}

/* rotating light band */
.earth:before{
  content:"";
  position:absolute;
  inset:-40%;
  background:
    linear-gradient(90deg,
      rgba(255,255,255,0) 0%,
      rgba(120,200,255,.35) 40%,
      rgba(255,255,255,0) 70%);
  animation:spin 22s linear infinite;
}
@keyframes spin{
  from{transform:translateX(-30%)}
  to{transform:translateX(30%)}
}

/* stability cones */
.cones{
  position:absolute;
  inset:0;
}
.cone{
  position:absolute;
  inset:0;
  clip-path:polygon(50% 50%,50% 0%,100% 0%,100% 100%);
  background:rgba(120,220,255,.35);
  opacity:.15;
  animation:pulse 12s infinite;
}
.cone:nth-child(2){transform:rotate(60deg);animation-delay:2s}
.cone:nth-child(3){transform:rotate(120deg);animation-delay:4s}
.cone:nth-child(4){transform:rotate(180deg);animation-delay:6s}
.cone:nth-child(5){transform:rotate(240deg);animation-delay:8s}
.cone:nth-child(6){transform:rotate(300deg);animation-delay:10s}

@keyframes pulse{
  0%,100%{opacity:.15}
  50%{opacity:.65}
}

/* labels */
.label{
  position:absolute;
  width:100%;
  text-align:center;
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#9fb7ff;
}
.l1{top:-40px}
.l2{right:-60px;top:30%}
.l3{right:-60px;bottom:30%}
.l4{bottom:-40px}
.l5{left:-60px;bottom:30%}
.l6{left:-60px;top:30%}

.title{
  position:fixed;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:#9fb7ff;
}
</style>
</head>

<body>

<div class="tabs">
  <a href="map.html">Map</a>
  <a href="capabilities.html">Enter</a>
</div>

<div class="stage">
  <div class="earth">
    <div class="cones">
      <div class="cone"></div>
      <div class="cone"></div>
      <div class="cone"></div>
      <div class="cone"></div>
      <div class="cone"></div>
      <div class="cone"></div>
    </div>

    <div class="label l1">Climate Variability</div>
    <div class="label l2">Freshwater Availability</div>
    <div class="label l3">Food Systems</div>
    <div class="label l4">Human Security</div>
    <div class="label l5">Coastal Stability</div>
    <div class="label l6">Ecosystems</div>
  </div>
</div>

<div class="title">Planetary Stability Thresholds</div>

</body>
</html>
