<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planetary Stability — Global Water Fund</title>

<style>
html,body{
  margin:0;height:100%;
  background:#05070d;
  color:white;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  overflow:hidden;
}

/* minimal corner menu */
.menu{
  position:fixed;
  top:14px;right:14px;
  z-index:100;
  font-size:12px;
  letter-spacing:.2em;
  text-transform:uppercase;
}
.menu a{
  color:#bbb;
  text-decoration:none;
  padding:10px 14px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;
  background:rgba(0,0,0,.5);
}

/* globe */
.stage{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
}
.globe{
  width:70vmin;
  height:70vmin;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 30%, #1b2a44, #03050a 60%);
  box-shadow:0 0 120px rgba(0,0,0,.8);
  position:relative;
  overflow:hidden;
}
.globe::before{
  content:"";
  position:absolute;
  inset:-40%;
  background:
    linear-gradient(90deg,
      rgba(255,255,255,0) 0%,
      rgba(120,180,255,.15) 40%,
      rgba(255,255,255,0) 70%);
  animation:spin 18s linear infinite;
}
@keyframes spin{
  from{transform:translateX(-30%)}
  to{transform:translateX(30%)}
}

/* six stability cones */
.cones{
  position:absolute;
  inset:0;
}
.cone{
  position:absolute;
  inset:0;
  clip-path:polygon(50% 50%,50% 0%,100% 0%,100% 100%);
  background:rgba(120,200,255,.15);
  opacity:.2;
  animation:pulse 12s infinite;
}
.cone:nth-child(2){transform:rotate(60deg);animation-delay:2s}
.cone:nth-child(3){transform:rotate(120deg);animation-delay:4s}
.cone:nth-child(4){transform:rotate(180deg);animation-delay:6s}
.cone:nth-child(5){transform:rotate(240deg);animation-delay:8s}
.cone:nth-child(6){transform:rotate(300deg);animation-delay:10s}

@keyframes pulse{
  0%,100%{opacity:.2}
  50%{opacity:.6}
}

.label{
  position:absolute;
  width:100%;
  text-align:center;
  bottom:-70px;
  font-size:12px;
  letter-spacing:.15em;
  color:#9fb7ff;
}
</style>
</head>

<body>

<div class="menu">
  <a href="map.html">Map</a>
</div>

<div class="stage">
  <div class="globe">
    <div class="cones">
      <div class="cone"></div>
      <div class="cone"></div>
      <div class="cone"></div>
      <div class="cone"></div>
      <div class="cone"></div>
      <div class="cone"></div>
    </div>
    <div class="label">PLANETARY STABILITY THRESHOLDS</div>
  </div>
</div>

</body
