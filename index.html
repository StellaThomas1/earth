<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Water Fund — Planetary Water Systems</title>

  <style>
    :root{
      /* Editorial daylight (not black, not baby-blue) */
      --skyTop:#ffffff;
      --skyMid:#f4f7ff;
      --skyBot:#e9f0ff;

      /* Ink + muted */
      --ink:#07121f;
      --muted:rgba(7,18,31,.64);
      --muted2:rgba(7,18,31,.46);

      /* Glass UI */
      --glass:rgba(255,255,255,.74);
      --glass2:rgba(255,255,255,.44);
      --stroke:rgba(7,18,31,.10);
      --shadow:rgba(7,18,31,.12);

      /* “Serious cobalt” (no neon) */
      --accent:#0b57d0;
      --accent2:#2a76e8;
      --water:#3aa0d8;     /* calmer cyan-blue */
    }

    html, body {
      margin:0;
      padding:0;
      height:100%;
      overflow-x:hidden;
      color:var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;

      background:
        radial-gradient(1100px 720px at 70% 40%, rgba(255,255,255,1) 0%, var(--skyTop) 30%, var(--skyMid) 62%, var(--skyBot) 100%);
    }

    .stage{
      position:relative;
      min-height:100vh;
      overflow:hidden;
    }

    #globe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
    }

    .heroText{
      position:relative;
      z-index:5;
      min-height:100vh;
      display:grid;
      align-content:center;
      padding: clamp(22px, 5vw, 72px);
      max-width: 1060px;
      pointer-events:none;
    }

    .kicker{
      text-transform:uppercase;
      letter-spacing:.18em;
      font-size:12px;
      color:var(--muted2);
      margin-bottom:12px;
      opacity:0;
      transform:translateY(10px);
      animation:fadeUp 0.85s ease forwards;
      animation-delay:.2s;
    }

    h1{
      font-size: clamp(38px, 4.6vw, 72px);
      line-height: 1.03;
      margin: 0 0 16px 0;
      font-weight: 650;
      opacity:0;
      transform:translateY(10px);
      animation:fadeUp 0.95s ease forwards;
      animation-delay:.48s;
      text-shadow: 0 16px 46px rgba(255,255,255,.55);
    }

    .sub{
      font-size: clamp(16px, 1.6vw, 21px);
      max-width: 64ch;
      color:var(--muted);
      line-height:1.55;
      opacity:0;
      transform:translateY(10px);
      animation:fadeUp 0.95s ease forwards;
      animation-delay:.74s;
    }

    .pillRow{
      margin-top: 18px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      opacity:0;
      transform:translateY(10px);
      animation:fadeUp 0.95s ease forwards;
      animation-delay: .98s;
    }

    .pill{
      font-size:12px;
      letter-spacing:.06em;
      color: rgba(7,18,31,.74);
      background: linear-gradient(180deg, var(--glass), var(--glass2));
      border: 1px solid var(--stroke);
      border-radius: 999px;
      padding: 8px 12px;
      box-shadow: 0 10px 28px var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .scrollHint{
      position:absolute;
      left:0; right:0;
      bottom: 20px;
      text-align:center;
      font-size:11px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color: rgba(7,18,31,.50);
      opacity:0;
      animation:fadeIn .9s ease forwards;
      animation-delay: 1.45s;
      z-index:6;
      pointer-events:none;
    }

    @media (max-width: 900px){
      .stage{ min-height: 85vh; }
      .heroText{ min-height: 85vh; padding: 22px; }
      .pillRow{ gap:8px; }
      .pill{ font-size:11px; padding:7px 10px; }
    }

    @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn { to { opacity:1; } }
  </style>
</head>

<body>
  <section class="stage" id="hero">
    <canvas id="globe"></canvas>

    <div class="heroText">
      <div class="kicker">GLOBAL WATER FUND</div>
      <h1>Water is the planet’s operating system.</h1>
      <p class="sub">
        Scroll to watch the hydrosphere detach into flow — the same flow we forecast, finance, and secure.
      </p>

      <div class="pillRow">
        <div class="pill">Strategic Forecasting</div>
        <div class="pill">Hydro-Geopolitical Intelligence</div>
        <div class="pill">Maritime + Coastal Risk</div>
        <div class="pill">Capital Stacks</div>
      </div>
    </div>

    <div class="scrollHint">Scroll</div>
  </section>

  <!-- Classic Three.js for compatibility -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <script>
    (function () {
      const canvas = document.getElementById("globe");
      const heroEl = document.getElementById("hero");

      const prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Accessible fallback
      if (prefersReducedMotion) {
        const fallback = document.createElement("div");
        fallback.style.position = "absolute";
        fallback.style.inset = "0";
        fallback.style.background =
          "radial-gradient(900px 620px at 72% 44%, rgba(11,87,208,.18) 0%, rgba(11,87,208,.06) 38%, rgba(255,255,255,0) 68%)," +
          "radial-gradient(700px 460px at 60% 54%, rgba(58,160,216,.12) 0%, rgba(255,255,255,0) 62%)";
        fallback.style.pointerEvents = "none";
        heroEl.insertBefore(fallback, canvas);
        canvas.style.opacity = "0";
        return;
      }

      const isMobile = window.matchMedia && window.matchMedia("(max-width: 900px)").matches;

      // Renderer
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.4 : 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      // Scene / Camera
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
      camera.position.set(0.35, 0.08, 6.15);

      // Daylight lighting (not spacey)
      scene.add(new THREE.AmbientLight(0xffffff, 0.95));

      const key = new THREE.DirectionalLight(0xffffff, 1.05);
      key.position.set(6, 3, 6);
      scene.add(key);

      const rim = new THREE.DirectionalLight(0xcfeaff, 0.45);
      rim.position.set(-7, -2, 2);
      scene.add(rim);

      // Earth textures (standard three.js examples)
      const TEX = {
        day:     "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg",
        normal:  "https://threejs.org/examples/textures/planets/earth_normal_2048.jpg",
        spec:    "https://threejs.org/examples/textures/planets/earth_specular_2048.jpg",
        clouds:  "https://threejs.org/examples/textures/planets/earth_clouds_1024.png"
      };

      const loader = new THREE.TextureLoader();
      loader.crossOrigin = "anonymous";

      const loadTex = (url) => new Promise((resolve, reject) => {
        loader.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; resolve(t); }, undefined, reject);
      });

      const seg = isMobile ? 96 : 128;

      const earthGeo  = new THREE.SphereGeometry(1.95, seg, seg);
      const cloudsGeo = new THREE.SphereGeometry(1.975, seg, seg);
      const hydroGeo  = new THREE.SphereGeometry(1.99, seg, seg);

      // Water particles (fall-off)
      const particleCount = isMobile ? 2200 : 3800;
      const pGeom = new THREE.BufferGeometry();
      const pPos = new Float32Array(particleCount * 3);
      const pVel = new Float32Array(particleCount * 3);

      function initParticles() {
        for (let i = 0; i < particleCount; i++){
          const u = Math.random();
          const v = Math.random();
          const theta = 2 * Math.PI * u;
          const phi = Math.acos(2*v - 1);
          const r = 2.00 + (Math.random() * 0.03);

          const x = r * Math.sin(phi) * Math.cos(theta);
          const y = r * Math.cos(phi);
          const z = r * Math.sin(phi) * Math.sin(theta);

          pPos[i*3+0] = x;
          pPos[i*3+1] = y;
          pPos[i*3+2] = z;

          // stronger gravity + elegant drift
          pVel[i*3+0] = (Math.random() - 0.5) * 0.006;
          pVel[i*3+1] = -0.020 - Math.random() * 0.020;
          pVel[i*3+2] = (Math.random() - 0.5) * 0.006;
        }
        pGeom.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
      }
      initParticles();

      const pMat = new THREE.PointsMaterial({
        color: 0x2a76e8,         // cobalt droplets, not neon
        size: isMobile ? 0.022 : 0.020,
        transparent: true,
        opacity: 0.0,
        depthWrite: false
      });

      const waterParticles = new THREE.Points(pGeom, pMat);
      scene.add(waterParticles);

      let earth, clouds, hydro;

      function clamp01(x){ return Math.max(0, Math.min(1, x)); }

      function getProgress(){
        const rect = heroEl.getBoundingClientRect();
        const h = heroEl.offsetHeight || window.innerHeight;
        return clamp01((-rect.top) / (h * 0.95));
      }

      function resize(){
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        if (!w || !h) return;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", resize);

      // Build scene after textures load
      Promise.all([loadTex(TEX.day), loadTex(TEX.normal), loadTex(TEX.spec), loadTex(TEX.clouds)])
        .then(([day, normal, spec, cloudsTex]) => {

          // Earth material tuned to be “real” + editorial
          earth = new THREE.Mesh(earthGeo, new THREE.MeshPhongMaterial({
            map: day,
            normalMap: normal,
            specularMap: spec,
            specular: new THREE.Color(0x1f4d6b),
            shininess: 18
          }));
          earth.rotation.y = 0.9;
          scene.add(earth);

          clouds = new THREE.Mesh(cloudsGeo, new THREE.MeshLambertMaterial({
            map: cloudsTex,
            transparent: true,
            opacity: 0.50,
            depthWrite: false
          }));
          clouds.rotation.y = earth.rotation.y + 0.35;
          scene.add(clouds);

          // Hydrosphere shell: less blue, more “glassy”
          hydro = new THREE.Mesh(hydroGeo, new THREE.MeshPhysicalMaterial({
            color: new THREE.Color(0x3aa0d8),
            transparent: true,
            opacity: 0.0,
            roughness: 0.18,
            metalness: 0.0,
            transmission: 0.82,
            thickness: 0.7,
            ior: 1.33,
            clearcoat: 1.0,
            clearcoatRoughness: 0.18
          }));
          hydro.rotation.copy(earth.rotation);
          scene.add(hydro);

          // Soft atmosphere rim (subtle)
          const atmo = new THREE.Mesh(
            new THREE.SphereGeometry(2.03, seg, seg),
            new THREE.MeshBasicMaterial({
              color: 0xbfe6ff,
              transparent: true,
              opacity: 0.075,
              depthWrite: false
            })
          );
          scene.add(atmo);

          animate();
        })
        .catch(err => console.error("Texture load error:", err));

      let t = 0;

      function animate(){
        requestAnimationFrame(animate);
        resize();

        const p = getProgress();
        t += 0.0068; // faster internal rhythm

        if (earth) {
          // Faster, cinematic motion (you asked for this)
          earth.rotation.y += 0.0032;

          earth.rotation.x = Math.sin(t) * 0.018;

          if (clouds) clouds.rotation.y += 0.00325;

          // Scroll parallax (more responsive)
          camera.position.z = 6.15 + p * (isMobile ? 0.95 : 1.15);
          camera.position.y = 0.08 + p * 0.22;

          // Hydrosphere choreography
          if (hydro) {
            hydro.rotation.copy(earth.rotation);

            // Re-timed to feel decisive:
            // 0.18–0.40 water appears
            // 0.40–0.75 shedding
            const waterBuild = clamp01((p - 0.18) / 0.22);
            const shed       = clamp01((p - 0.40) / 0.35);
            const after      = clamp01((p - 0.82) / 0.18);

            hydro.material.opacity = (0.38 * waterBuild) * (1.0 - shed);
            pMat.opacity = (0.62 * shed) * (1.0 - after);

            // Particle fall (stronger gravity, clearer effect)
            if (shed > 0) {
              const posAttr = pGeom.getAttribute("position");
              const accel = 0.010 + shed * 0.020;  // strong, dramatic but still elegant

              for (let i = 0; i < particleCount; i++){
                pPos[i*3+0] += pVel[i*3+0] * (1 + shed * 2.2);
                pPos[i*3+1] += (pVel[i*3+1] - accel) * (1 + shed * 1.8);
                pPos[i*3+2] += pVel[i*3+2] * (1 + shed * 2.2);

                // recycle
                if (pPos[i*3+1] < -4.6) {
                  const u = Math.random(), v = Math.random();
                  const theta = 2 * Math.PI * u;
                  const phi = Math.acos(2*v - 1);
                  const r = 2.00 + (Math.random() * 0.03);
                  pPos[i*3+0] = r * Math.sin(phi) * Math.cos(theta);
                  pPos[i*3+1] = r * Math.cos(phi);
                  pPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
                }
              }
              posAttr.needsUpdate = true;
            }
          }
        }

        renderer.render(scene, camera);
      }
    })();
  </script>
</body>
</html>
