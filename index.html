<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Water Fund — Planetary Water Systems</title>

  <style>
    :root{
      --bg:#05070b;
      --ink:#eaf2ff;
      --muted:rgba(234,242,255,.72);
      --muted2:rgba(234,242,255,.55);
    }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow-x: hidden;
    }
    .stage { position: relative; min-height: 100vh; overflow: hidden; }
    #globe { position: absolute; inset: 0; width: 100%; height: 100%; display:block; }
    .heroText{
      position: relative; z-index: 5;
      min-height: 100vh;
      display: grid; align-content: center;
      padding: clamp(24px, 5vw, 72px);
      max-width: 980px;
    }
    .kicker{
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: 12px;
      color: var(--muted2);
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 1s ease forwards;
      animation-delay: .35s;
    }
    h1{
      font-size: clamp(36px, 4.5vw, 64px);
      line-height: 1.05;
      margin: 0 0 18px 0;
      font-weight: 650;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 1.1s ease forwards;
      animation-delay: .75s;
    }
    .sub{
      font-size: clamp(16px, 1.6vw, 20px);
      max-width: 60ch;
      color: var(--muted);
      line-height: 1.55;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 1.1s ease forwards;
      animation-delay: 1.15s;
    }
    .scroll{
      position:absolute; bottom: 28px; left:0; right:0;
      text-align:center;
      font-size: 11px;
      letter-spacing: .12em;
      color: var(--muted2);
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 2.1s;
    }

    /* Mobile-first: hero height */
    @media (max-width: 900px){
      .stage { min-height: 75vh; }
      .heroText { min-height: 75vh; }
    }

    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>
</head>

<body>
  <section class="stage" id="hero">
    <canvas id="globe"></canvas>

    <div class="heroText">
      <div class="kicker">GLOBAL WATER FUND</div>
      <h1>Water Is the Planet’s Operating System</h1>
      <p class="sub">Climate, food, energy, trade, and security all flow through water.</p>
    </div>

    <div class="scroll">Scroll</div>
  </section>

  <!-- Classic (non-module) Three.js for maximum compatibility -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <script>
    const canvas = document.getElementById("globe");

    // Renderer
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // Scene + Camera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
    camera.position.set(0, 0, 6.2);

    // Lights
    scene.add(new THREE.AmbientLight(0x0b1830, 0.75));
    const sun = new THREE.DirectionalLight(0xffffff, 1.15);
    sun.position.set(5, 3, 5);
    scene.add(sun);

    // Procedural texture
    function createTexture(size=768){
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const ctx = c.getContext("2d");

      const grad = ctx.createRadialGradient(size*0.35, size*0.35, size*0.08, size*0.5, size*0.5, size*0.85);
      grad.addColorStop(0,"#0e5b8a");
      grad.addColorStop(0.42,"#08345e");
      grad.addColorStop(1,"#02060f");
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,size,size);

      // soft “river/circulation” speckles
      ctx.globalAlpha = 0.22;
      for(let i=0;i<1400;i++){
        ctx.fillStyle = `rgba(120,200,255,${Math.random()*0.25})`;
        ctx.beginPath();
        ctx.arc(Math.random()*size, Math.random()*size, Math.random()*5+1.5, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const texture = createTexture();

    // Globe
    const globe = new THREE.Mesh(
      new THREE.SphereGeometry(1.9, 96, 96),
      new THREE.MeshStandardMaterial({
        map: texture,
        emissive: new THREE.Color(0x2d6cff),
        emissiveMap: texture,
        emissiveIntensity: 0.55,
        roughness: 0.9,
        metalness: 0.05
      })
    );
    scene.add(globe);

    // Resize to canvas client size (prevents 0-height issues)
    function resize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);

    // Animate
    function animate(){
      resize();
      globe.rotation.y += 0.00115;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
