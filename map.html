<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Global Water Fund — Map</title>

  <style>
    :root{
      --bg:#05060a;
      --ink:rgba(245,248,255,.92);
      --muted:rgba(245,248,255,.72);
      --muted2:rgba(245,248,255,.56);
      --line:rgba(255,255,255,.085);
      --line2:rgba(255,255,255,.055);
      --aqua:rgba(170,240,255,.30);
    }

    html,body{
      margin:0;
      height:100%;
      background:var(--bg);
      color:var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      -webkit-text-size-adjust:100%;
      overflow-x:hidden;
    }

    /* ---- LAYERS ---- */
    .stage{
      position:relative;
      min-height:100vh;
      min-height:100svh;
      min-height:100dvh;
      overflow:hidden;
    }

    /* Fullscreen map image */
    .mapLayer{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background-image:url("world.topo.bathy.200412.3x5400x2700.jpg");
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      /* cinematic grading */
      filter: contrast(1.06) saturate(0.95) brightness(0.78);
      opacity:0;
      transform: translateY(12px);
      transition: opacity 1.4s ease, transform 1.4s ease, filter 1.4s ease;
    }
    .mapLayer.on{
      opacity:0.92;
      transform:translateY(0);
      filter: contrast(1.06) saturate(0.98) brightness(0.82);
    }

    /* Subtle engineered grid */
    .gridLayer{
      position:fixed;
      inset:0;
      z-index:1;
      pointer-events:none;
      opacity:.55;
      background:
        linear-gradient(to right, var(--line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--line2) 1px, transparent 1px);
      background-size: 84px 84px;
      mix-blend-mode: overlay;
      transform: translateZ(0);
    }

    /* Vignette + mood */
    .vignette{
      position:fixed;
      inset:0;
      z-index:4;
      pointer-events:none;
      background:
        radial-gradient(1100px 800px at 55% 35%, rgba(0,0,0,.08) 0%, rgba(0,0,0,.55) 62%, rgba(0,0,0,.82) 100%),
        radial-gradient(900px 680px at 40% 70%, rgba(20,30,55,.22) 0%, rgba(0,0,0,0) 60%);
    }

    /* Animated currents canvas */
    #currents{
      position:fixed;
      inset:0;
      z-index:3;
      pointer-events:none;
      opacity:.55;
      mix-blend-mode: screen;
    }

    /* ---- CONTENT ---- */
    .content{
      position:relative;
      z-index:10;
      min-height:100vh;
      padding:
        calc(18px + env(safe-area-inset-top))
        calc(18px + env(safe-area-inset-right))
        calc(18px + env(safe-area-inset-bottom))
