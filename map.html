<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Global Operating Picture — Global Water Fund</title>

<style>
html,body{
  margin:0;height:100%;
  background:#05070d;
  color:white;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  overflow:hidden;
}

/* minimal corner menu */
.menu{
  position:fixed;
  top:14px;right:14px;
  z-index:100;
  font-size:12px;
  letter-spacing:.2em;
  text-transform:uppercase;
}
.menu a{
  color:#bbb;
  text-decoration:none;
  padding:10px 14px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;
  background:rgba(0,0,0,.5);
}

/* stage */
.stage{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
}

/* map panel */
.panel{
  width:92vw;
  height:70vh;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  border:1px solid rgba(255,255,255,.1);
  background:black;
}

/* map image (no huge file required) */
.map{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.6)),
    url("https://eoimages.gsfc.nasa.gov/images/imagerecords/73000/73909/world.topo.bathy.200412.3x5400x2700.jpg");
  background-size:cover;
  background-position:center;
  filter:contrast(1.1) brightness(.8);
}

/* ocean currents */
.currents{
  position:absolute;
  inset:0;
  background:
    radial-gradient(800px 500px at 30% 60%, rgba(120,200,255,.15), transparent 60%),
    radial-gradient(900px 600px at 70% 40%, rgba(160,255,220,.12), transparent 60%);
  mix-blend-mode:screen;
  animation:drift 14s ease-in-out infinite;
}
@keyframes drift{
  0%{transform:translateX(-2%)}
  50%{transform:translateX(2%)}
  100%{transform:translateX(-2%)}
}

/* center text */
.center{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
}
.kicker{
  font-size:11px;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:#9fb7ff;
}
.big{
  font-size:clamp(20px,3vw,42px);
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-top:10px;
}
.sub{
  max-width:60ch;
  margin:12px auto;
  font-size:14px;
  color:#ccc;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="menu">
  <a href="planetary.html">Stability</a>
</div>

<div class="stage">
  <div class="panel">
    <div class="map"></div>
    <div class="currents"></div>

    <div class="center">
      <div>
        <div class="kicker">Global Operating Picture</div>
        <div class="big">Water Is Earth’s Operating System</div>
        <div class="sub">
          We translate basin stress and cross-border dependencies into decision-ready intelligence for governments,
          investors, and operators.
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
