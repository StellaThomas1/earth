<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Global Water Fund — Systems Map</title>

  <style>
    :root{
      --bg:#05060a;
      --ink:rgba(245,248,255,.92);
      --muted:rgba(245,248,255,.70);
      --muted2:rgba(245,248,255,.56);
      --hair:rgba(255,255,255,.10);
      --hair2:rgba(170,240,255,.10);
    }

    html,body{
      height:100%;
      margin:0;
      background: radial-gradient(1000px 700px at 55% 30%, rgba(20,26,44,.75) 0%, rgba(8,10,16,.95) 55%, #04050a 100%);
      color:var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      -webkit-text-size-adjust:100%;
      overflow:hidden;
    }

    /* --- Map layer (image) --- */
    .mapLayer{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;

      /* Put your own file in the repo root as: world.topo.bathy.200412.3x5400x2700.jpg
         OR change this filename to your own image (case sensitive!) */
      background-image:
        url("world.topo.bathy.200412.3x5400x2700.jpg");
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      /* Davos-grade grading */
      filter: contrast(1.06) saturate(0.95) brightness(0.72);
      opacity:0;
      transform: translateY(14px);
      transition: opacity 1.6s ease, transform 1.6s ease, filter 1.6s ease;
    }
    .mapLayer.on{
      opacity:0.92;
      transform: translateY(0);
      filter: contrast(1.06) saturate(0.98) brightness(0.80);
    }

    /* --- Canvas overlays (grid + currents shimmer) --- */
    canvas#fx{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
      pointer-events:none;
      display:block;
    }

    /* --- Typography / content --- */
    .stage{
      position:fixed;
      inset:0;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:
        calc(18px + env(safe-area-inset-top))
        calc(18px + env(safe-area-inset-right))
        calc(18px + env(safe-area-inset-bottom))
        calc(18px + env(safe-area-inset-left));
      pointer-events:none;
    }

    .card{
      width:min(1040px, 94vw);
      display:flex;
      flex-direction:column;
      gap:14px;
      transform: translateY(10px);
      opacity:0;
      transition: opacity 1.5s ease, transform 1.5s ease;
    }
    .card.on{
      opacity:1;
      transform: translateY(0);
    }

    .brand{
      font-size:12px;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:var(--muted2);
    }

    .systems{
      font-size:clamp(16px, 3.2vw, 28px);
      font-weight:780;
      letter-spacing:.16em;
      text-transform:uppercase;
      margin:0;
      line-height:1.12;
    }

    .pillRow{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:2px;
    }

    .pill{
      font-size:11px;
      letter-spacing:.16em;
      text-transform:uppercase;
      padding:10px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.18);
      color:rgba(245,248,255,.78);
      backdrop-filter: blur(10px);
    }

    .headline{
      margin:6px 0 0 0;
      font-size:clamp(16px, 2.2vw, 22px);
      font-weight:700;
      letter-spacing:.10em;
      text-transform:uppercase;
      color:rgba(245,248,255,.90);
    }

    .subcopy{
      max-width:860px;
      font-size:clamp(13px, 1.5vw, 15px);
      line-height:1.85;
      color:var(--muted);
      margin:0;
    }

    .footerLine{
      margin-top:10px;
      font-size:12px;
      letter-spacing:.20em;
      text-transform:uppercase;
      color:rgba(245,248,255,.62);
      opacity:.85;
    }

    /* --- Single MENU pill (top-right) --- */
    .menuCorner{
      position:fixed;
      top:12px;
      right:12px;
      z-index:99999;
      pointer-events:auto;
    }

    .menuBtn{
      font:inherit;
      font-size:11px;
      letter-spacing:.18em;
      text-transform:uppercase;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.62);
      color:rgba(245,248,255,.82);
      cursor:pointer;
      backdrop-filter:blur(10px);
    }
    .menuBtn:hover{
      background:rgba(0,0,0,.78);
      border-color:rgba(255,255,255,.18);
    }

    .menuList{
      position:absolute;
      right:0;
      top:38px;
      min-width:220px;
      padding:10px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.72);
      backdrop-filter:blur(14px);
      display:none;
    }
    .menuCorner.open .menuList{ display:block; }

    .menuList a{
      display:block;
      padding:10px 10px;
      border-radius:10px;
      font-size:11px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:rgba(245,248,255,.72);
      text-decoration:none;
      white-space:nowrap;
    }
    .menuList a:hover{
      background:rgba(255,255,255,.06);
      color:rgba(245,248,255,.95);
    }

    /* --- Mobile polish: keep it calm, not crowded --- */
    @media (max-width: 760px){
      .stage{
        align-items:flex-start;
        padding-top: calc(64px + env(safe-area-inset-top)); /* breathing room under MENU */
      }
      .card{
        gap:12px;
      }
      .pill{
        padding:9px 10px;
        font-size:10px;
        letter-spacing:.14em;
      }
      .subcopy{
        line-height:1.72;
