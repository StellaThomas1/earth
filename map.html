<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Global Water Fund — Systems Map</title>

  <style>
    :root{
      --bg:#05060a;
      --bg2:#0b0f1a;
      --ink:rgba(245,248,255,.92);
      --muted:rgba(245,248,255,.74);
      --muted2:rgba(245,248,255,.56);
      --grid:rgba(245,248,255,.08);
      --grid2:rgba(245,248,255,.05);
      --glow:rgba(170,240,255,.28);
      --glow2:rgba(170,240,255,.10);
    }

    html,body{
      margin:0;
      height:100%;
      background: radial-gradient(1200px 900px at 60% 30%, var(--bg2) 0%, var(--bg) 60%, #04050a 100%);
      color:var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow-x:hidden;
      -webkit-text-size-adjust:100%;
    }

    /* Subtle global grid (Mercator vibe) */
    body:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        /* longitude lines */
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          transparent 84px,
          var(--grid) 85px,
          transparent 86px
        ),
        /* latitude lines */
        repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 58px,
          var(--grid2) 59px,
          transparent 60px
        );
      opacity:.55;
      mix-blend-mode:screen

            mix-blend-mode:screen;
    }

    .wrap{
      min-height:120vh;
    }

    .hero{
      min-height:100vh;
      min-height:100svh;
      min-height:100dvh;
      position:relative;
      overflow:hidden;
    }

    /* Fullscreen map canvas */
    canvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      pointer-events:none;
    }

    .overlay{
      position:relative;
      z-index:10;
      min-height:100vh;
      display:grid;
      grid-template-columns:minmax(280px,520px) 1fr;
      gap:clamp(16px,3vw,44px);
      align-items:center;
      padding-top:calc(18px + env(safe-area-inset-top));
      padding-bottom:calc(18px + env(safe-area-inset-bottom));
      padding-left:calc(18px + env(safe-area-inset-left));
      padding-right:calc(18px + env(safe-area-inset-right));
      padding-inline:clamp(18px,4.5vw,64px);
      pointer-events:none;
    }

    .kicker{
      text-transform:uppercase;
      letter-spacing:.20em;
      font-size:12px;
      color:var(--muted2);
      margin-bottom:14px;
    }

    h1{
      margin:0 0 12px 0;
      font-size:clamp(22px,2.4vw,34px);
      line-height:1.15;
      font-weight:700;
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    .sub{
      margin-top:10px;
      font-size:12px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:rgba(245,248,255,.62);
    }

    .copy p{
      margin:10px 0;
      font-size:clamp(13px,1.15vw,15px);
      line-height:1.92;
      text-align:justify;
      text-justify:inter-word;
      color:var(--muted);
      max-width:520px;
    }

    .tagline{
      margin-top:18px;
      font-size:12px;
      letter-spacing:.20em;
      text-transform:uppercase;
      color:rgba(245,248,255,.64);
      opacity:0;
      transform:translateY(8px);
      transition:opacity 1.4s ease, transform 1.4s ease;
    }
    .tagline.on{ opacity:1; transform:translateY(0); }

    /* Systems words overlay (engineered, quiet) */
    .labels{
      position:relative;
      width:min(86vh,940px);
      height:min(86vh,940px);
      justify-self:center;
      pointer-events:none;
    }

    .chip{
      position:absolute;
      padding:10px 14px;
      border-radius:18px;
      border:1px solid rgba(245,248,255,.14);
      background:rgba(10,14,24,.42);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 0 0 1px rgba(10,14,24,.28) inset, 0 0 28px rgba(170,240,255,.06);
      opacity:0;
      transform:translateY(10px);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }

    .chip strong{
      display:block;
      font-weight:760;
      letter-spacing:.18em;
      font-size:12px;
      text-transform:uppercase;
      color:rgba(245,248,255,.92);
    }
    .chip span{
      display:block;
      margin-top:6px;
      font-size:12px;
      line-height:1.35;
      color:rgba(245,248,255,.64);
      letter-spacing:.02em;
      text-transform:none;
      max-width:260px;
    }

    .chip.on{
      opacity:1;
      transform:translateY(0);
    }

    /* Chip positions (relative to map) */
    .c-basins{ left:12%; top:52%; }
    .c-networks{ right:10%; top:26%; }
    .c-cascades{ right:8%; top:60%; }
    .c-warning{ left:14%; top:22%; }
    .c-infra{ left:10%; bottom:18%; }
    .c-options{ right:12%; bottom:14%; }

    .hint{
      position:fixed;
      left:50%;
      bottom:14px;
      transform:translateX(-50%);
